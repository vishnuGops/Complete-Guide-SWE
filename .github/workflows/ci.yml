name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the previous run's answer worthless. On main every
# commit keeps its own run, because that is the history the branch is judged by.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # The generated JSON Schemas are checked in so editors can complete
      # meta.json, and `emit-schema.ts` has always said CI verifies them. It
      # does now (ROADMAP P2-14).
      - name: Schemas match the zod source
        run: npm run problems:schema -- --check

      # The build has its own tsconfig and an asset-copy step that `typecheck`
      # never exercises. One OS is enough to catch a broken build config.
      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: npm run build

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
        # The harness promises Python 3.10 (CLAUDE.md > Environment) and nothing
        # ran it below 3.12 until now: one Linux cell on the oldest supported
        # minor, because a `match` statement or a PEP 604 union slipping into
        # `runner.py` is exactly the kind of thing that only fails for the user
        # with the older interpreter (ROADMAP P2-14).
        include:
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` diffs against the merge base, which needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The judge resolves `python`, `javac` and `java` from PATH. Both setup
      # actions provide exactly those names on both runners, so the executors
      # need no environment overrides here.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Report toolchain
        shell: bash
        run: |
          node --version
          python --version
          javac -version
          java -version

      - run: npm ci

      - name: Unit and contract tests
        run: npm run test:unit

      # OS-sensitive by nature: real subprocesses, process trees, encodings.
      - name: Judge integration tests
        run: npm run test:integration

      # The merge gate for content: every reference solution passes every test
      # in both languages, and both starters compile.
      #
      # Incremental on a pull request (D23): the static rules still cover the
      # whole catalogue - that is where the cross-problem checks live - and the
      # reference runs are limited to the problems the branch touched, unless
      # the judge, the harnesses, a checker or the shared schemas changed, in
      # which case everything runs. On main it is always everything.
      - name: Problem contract (changed problems)
        if: github.event_name == 'pull_request'
        run: npm run problems:validate -- --changed origin/${{ github.base_ref }}

      - name: Problem contract (whole catalogue)
        if: github.event_name != 'pull_request'
        run: npm run problems:validate

  # Generated tests are only reproducible on the Python minor they were made
  # with, so this lane pins it rather than sharing the test matrix's (P2-14).
  #
  # On pull requests too since P8-7, incrementally like the problem contract
  # (D23): until then an edited generator.py with a stale tests.json merged
  # green and was caught on main, after the fact.
  generators:
    name: generators (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-problem diff needs the merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read the generating Python version
        id: python
        run: |
          version=$(grep -v '^#' problems/GENERATED_WITH | grep -v '^$' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}

      - run: npm ci

      # An edited generator.py with a stale tests.json passes every other check
      # in this file: nothing re-runs the generator. This does.
      #
      # A pull request checks the problems it touched, or every problem when
      # what generation runs through changed - the generator runtime and the
      # loader under problems/, the judge that runs the reference as the
      # oracle, the shared schemas, or the pinned Python minor. The same rule
      # `problems:validate --changed` applies, written here because
      # `problems:gen --check` takes one slug or all of them.
      - name: Tests still match their generators (changed problems)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_REF...HEAD")
          if grep -qE '^(apps/server/src/(judge|problems)/|packages/shared/|problems/GENERATED_WITH$)' <<< "$changed"; then
            echo "Generation itself changed; checking every problem."
            npm run problems:gen -- --check
            exit 0
          fi
          slugs=$(awk -F/ '$1 == "problems" && NF >= 4 { print $3 }' <<< "$changed" | sort -u)
          if [ -z "$slugs" ]; then
            echo "No problem changed; nothing to regenerate."
            exit 0
          fi
          failed=0
          for slug in $slugs; do
            # A deleted problem has nothing left to check.
            if ! compgen -G "problems/*/$slug/meta.json" > /dev/null; then continue; fi
            npm run problems:gen -- --check "$slug" || failed=1
          done
          exit "$failed"

      - name: Tests still match their generators (whole catalogue)
        if: github.event_name != 'pull_request'
        run: npm run problems:gen -- --check

  # The Docker executor (P9-2) against a real daemon. Linux only: the hosted
  # Windows runners have Docker, but only for Windows containers, and the judge
  # images are Linux ones. Nothing here needs a local Python or JDK - which is
  # the point of the executor - so neither setup action runs.
  docker:
    name: docker executor (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The executor never pulls during a run (`--pull never`), so the images
      # have to be here first. Keep in step with DOCKER_IMAGES in
      # apps/server/src/judge/executors/commands.ts.
      - name: Pull the judge images
        run: |
          docker pull python:3.14-slim
          docker pull eclipse-temurin:21-jdk

      - run: npm ci

      - name: Doctor, in Docker mode
        run: npm run doctor
        env:
          DEVPROMAX_EXECUTOR: docker

      - name: Docker executor integration tests
        run: npx vitest run --project server-integration docker.integration.test
        env:
          DEVPROMAX_DOCKER_TESTS: '1'

  # Format on save (ROADMAP P9-5). Both formatters are optional, so nothing else
  # installs them and their integration suite is opt-in; this lane opts in, on
  # the versions pinned here. Keep in step with the E2E lane's black below.
  formatters:
    name: formatters (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLACK_VERSION: '26.5.1'
      GJF_VERSION: '1.36.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # google-java-format runs on the judge's java, which is why it is a jar
      # and an environment variable rather than something on PATH.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the formatters
        run: |
          pip install "black==$BLACK_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/google-java-format.jar"             "https://github.com/google/google-java-format/releases/download/v$GJF_VERSION/google-java-format-$GJF_VERSION-all-deps.jar"
          echo "DEVPROMAX_GOOGLE_JAVA_FORMAT=$RUNNER_TEMP/google-java-format.jar" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Doctor, which lists the formatters
        run: npm run doctor

      - name: Formatter integration tests
        run: npx vitest run --project server-integration formatters.integration.test
        env:
          DEVPROMAX_FORMATTER_TESTS: '1'

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The golden path submits code, so the E2E environment needs the same
      # interpreters the judge does.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # For e2e/format.spec.ts (P9-5), which skips without black anywhere else
      # and fails without it here.
      - name: Install black
        run: pip install "black==26.5.1"

      - run: npm ci

      - uses: ./.github/actions/playwright-chromium

      # For e2e/production.spec.ts, which runs the built output and fails in CI
      # without it (ROADMAP P8-7). It used to skip here, so `npm start` - the
      # command a user actually runs - had no test in CI at all.
      - run: npm run build

      - run: npm run test:e2e
        env:
          DEVPROMAX_FORMATTER_TESTS: '1'

      # Retries are a CI-only affordance (P8-1). Counting them is what stops
      # the suite from quietly retrying its way to green.
      - name: Flake budget
        if: ${{ !cancelled() }}
        run: npm run test:e2e:flake-budget -w @devpromax/web

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ubuntu
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  perf:
    name: performance budgets (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lighthouse scores what ships, not a dev server (ROADMAP P8-2), so the
      # build has to exist before it runs.
      - run: npm run build

      # The same pinned Chromium the E2E suite uses, so the scores are
      # comparable between machines and between runs.
      - uses: ./.github/actions/playwright-chromium

      - name: Lighthouse, both themes, performance and accessibility >= 90
        run: npm run perf:lighthouse
