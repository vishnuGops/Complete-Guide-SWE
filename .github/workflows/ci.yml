name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the previous run's answer worthless. On main every
# commit keeps its own run, because that is the history the branch is judged by.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # The build has its own tsconfig and an asset-copy step that `typecheck`
      # never exercises. One OS is enough to catch a broken build config.
      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: npm run build

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The judge resolves `python`, `javac` and `java` from PATH. Both setup
      # actions provide exactly those names on both runners, so the executors
      # need no environment overrides here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Report toolchain
        shell: bash
        run: |
          node --version
          python --version
          javac -version
          java -version

      - run: npm ci

      - name: Unit and contract tests
        run: npm run test:unit

      # OS-sensitive by nature: real subprocesses, process trees, encodings.
      - name: Judge integration tests
        run: npm run test:integration

      # The merge gate for content: every reference solution passes every test
      # in both languages, and both starters compile.
      - name: Problem contract
        run: npm run problems:validate

  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The golden path submits code, so the E2E environment needs the same
      # interpreters the judge does.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ubuntu
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
