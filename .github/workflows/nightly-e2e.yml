name: Nightly

# Two things that are too slow or too flaky to gate a pull request, and still
# have to keep working.
#
# Playwright on Windows is slow and historically the flakiest lane we have, so
# it does not gate PRs. It still has to keep working: Windows is the owner's
# primary platform, and a break here is a break for the only user who matters.
#
# The whole catalogue is validated nightly as D23 says it is, on both OSes.
# `main` already does that on every push, but a night with no push is a night
# the runner images can move - a new Python patch, a new JDK build - under 171
# problems nobody touched, and this is where that shows up first.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - uses: ./.github/actions/playwright-chromium

      # For e2e/production.spec.ts, which runs the built output and fails in CI
      # without it (ROADMAP P8-7).
      - run: npm run build

      - run: npm run test:e2e

      # Retries are a CI-only affordance (P8-1). Counting them is what stops
      # the suite from quietly retrying its way to green.
      - name: Flake budget
        if: ${{ !cancelled() }}
        run: npm run test:e2e:flake-budget -w @devpromax/web

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-windows
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The problem contract over the whole catalogue (D23), the same command the
  # `main` lane runs.
  problems:
    name: problems (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Problem contract (whole catalogue)
        run: npm run problems:validate

  # And the generators, on the Python minor the catalogue was generated with
  # (see the `generators` lane in ci.yml for why it is pinned).
  generators:
    name: generators (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read the generating Python version
        id: python
        run: |
          version=$(grep -v '^#' problems/GENERATED_WITH | grep -v '^$' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python.outputs.version }}

      - run: npm ci

      - name: Tests still match their generators
        run: npm run problems:gen -- --check
